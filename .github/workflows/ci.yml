# Fast checks on every push: lint the scripts and make sure every step's
# explain mode (--dry-run) still runs. A full build is too heavy for CI.
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x build.sh scripts/*.sh scripts/lib/common.sh scripts/rootfs/*.sh

      - name: explain mode (dry-run) of every step
        run: |
          set -o pipefail
          ./build.sh info
          for args in uboot kernel rootfs image "-r alpine rootfs"; do
            echo "::group::--dry-run $args"
            ./build.sh --dry-run $args 2>&1 | tee out.log
            echo "::endgroup::"
            # errors inside subshells do not change the exit code, so also scan the output
            if grep -E "FAILED|ERROR:" out.log; then
              echo "::error::--dry-run $args reported an error"; exit 1
            fi
          done
