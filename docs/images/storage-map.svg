<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="The three SD/MMC controllers of the i.MX 8M Plus and their names in each layer: uSDHC1 at 0x30B40000 is the Wi-Fi SDIO slot, mmc0 in Linux; uSDHC2 at 0x30B50000 is the SD card slot, mmc 1 in U-Boot and /dev/mmcblk1 in Linux; uSDHC3 at 0x30B60000 is the on-module eMMC, mmc 2 in U-Boot and /dev/mmcblk2 in Linux with boot0, boot1 and RPMB hardware partitions. The image this repository builds goes to the start of the SD card or the eMMC user area, with the boot container at 32 KiB and the root partition at 8 MiB.">
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; fill: #e5edf7; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .t { font-size: 25px; font-weight: 700; }
    .st { font-size: 14px; }
    .row { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    .hd { font-size: 17px; font-weight: 800; }
    .nm { font-size: 14px; font-weight: 700; }
    .sm { font-size: 12px; }
    .xs { font-size: 11px; }
  </style>
  <rect width="1400" height="700" rx="18" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="1399" height="699" rx="18" fill="none" stroke="#1e2a44"/>
  <text class="t" x="30" y="44">One SD card, three names: storage across the layers</text>
  <text class="st" x="30" y="68" style="fill:#9fb0c6">The i.MX 8M Plus has three SD/MMC controllers. Each layer numbers them differently. Read a column top to bottom.</text>

  <!-- row labels -->
  <text class="row" x="30" y="132" style="fill:#9fb0c6">CONTROLLER</text>
  <text class="row" x="30" y="206" style="fill:#9fb0c6">WIRED TO</text>
  <text class="row" x="30" y="282" style="fill:#9fb0c6">BOOT ROM</text>
  <text class="row" x="30" y="350" style="fill:#9fb0c6">U-BOOT</text>
  <text class="row" x="30" y="418" style="fill:#9fb0c6">LINUX</text>
  <text class="row" x="30" y="512" style="fill:#9fb0c6">THIS REPO</text>
  <text class="row" x="30" y="528" style="fill:#9fb0c6">WRITES</text>

  <!-- column 1: uSDHC1 -->
  <rect x="170" y="100" width="340" height="540" rx="14" fill="#0f192d" stroke="#26344f"/>
  <text class="hd" x="340" y="130" text-anchor="middle" style="fill:#8a9bb3">uSDHC1</text><text class="xs mono" x="340" y="148" text-anchor="middle" style="fill:#8a9bb3">0x30B4_0000</text>
  <text class="nm" x="340" y="206" text-anchor="middle" style="fill:#8a9bb3">Wi-Fi / BT module (SDIO)</text><text class="xs" x="340" y="224" text-anchor="middle" style="fill:#8a9bb3">optional on the SOM</text>
  <text class="sm" x="340" y="282" text-anchor="middle" style="fill:#94a3b8">not a boot device</text>
  <text class="sm" x="340" y="350" text-anchor="middle" style="fill:#94a3b8">not used</text>
  <text class="nm mono" x="340" y="418" text-anchor="middle" style="fill:#8a9bb3">mmc0</text>
  <text class="xs" x="340" y="438" text-anchor="middle" style="fill:#8a9bb3">"Failed to initialize a non-removable</text><text class="xs" x="340" y="453" text-anchor="middle" style="fill:#8a9bb3">card" when no Wi-Fi chip is fitted</text>
  <text class="sm" x="340" y="520" text-anchor="middle" style="fill:#94a3b8">nothing</text>

  <!-- column 2: uSDHC2 SD -->
  <rect x="530" y="100" width="410" height="540" rx="14" fill="#052620" stroke="#2dd4bf" stroke-width="1.5"/>
  <text class="hd" x="735" y="130" text-anchor="middle" style="fill:#5eead4">uSDHC2</text><text class="xs mono" x="735" y="148" text-anchor="middle" style="fill:#5eead4">0x30B5_0000</text>
  <text class="nm" x="735" y="206" text-anchor="middle">SD card slot (carrier board)</text><text class="xs" x="735" y="224" text-anchor="middle" style="fill:#9fb0c6">card-detect GPIO, UHS-I SDR104</text>
  <rect x="580" y="262" width="310" height="30" rx="15" fill="#0f766e"/><text class="sm" x="735" y="282" text-anchor="middle" style="fill:#fff">boot switch = SD → reads it at 32 KiB</text>
  <text class="nm mono" x="735" y="350" text-anchor="middle">mmc 1</text><text class="xs mono" x="735" y="368" text-anchor="middle" style="fill:#9fb0c6">sd_dev=1 · mmcdev=1 when booted from SD</text>
  <text class="nm mono" x="735" y="418" text-anchor="middle">/dev/mmcblk1</text>
  <text class="xs mono" x="735" y="438" text-anchor="middle" style="fill:#9fb0c6">└ mmcblk1p1 → mounted as /  (root=/dev/mmcblk1p1)</text>
  <!-- layout strip -->
  <rect x="550" y="490" width="22" height="34" fill="#475569"/>
  <rect x="572" y="490" width="10" height="34" fill="#1d2a45"/>
  <rect x="582" y="490" width="110" height="34" fill="#2563eb"/><text class="xs" x="637" y="511" text-anchor="middle" style="fill:#fff;font-weight:700">imx-boot.bin</text>
  <rect x="692" y="490" width="20" height="34" fill="#1d2a45"/>
  <rect x="712" y="490" width="24" height="34" fill="#94a3b8"/>
  <rect x="736" y="490" width="184" height="34" fill="#0f766e"/><text class="xs" x="828" y="511" text-anchor="middle" style="fill:#fff;font-weight:700">p1 ext4 "root"</text>
  <text class="xs mono" x="550" y="540" style="fill:#9fb0c6">0</text><text class="xs mono" x="582" y="540" style="fill:#9fb0c6">32K</text><text class="xs mono" x="700" y="540" style="fill:#9fb0c6">7M</text><text class="xs mono" x="736" y="540" style="fill:#9fb0c6">8M</text><text class="xs mono" x="920" y="540" text-anchor="end" style="fill:#9fb0c6">end</text>
  <text class="xs mono" x="735" y="572" text-anchor="middle" style="fill:#5eead4">./build.sh flash -d /dev/sdX --expand</text>
  <text class="xs" x="735" y="592" text-anchor="middle" style="fill:#9fb0c6">(on your PC the card is /dev/sdX, not mmcblk)</text>

  <!-- column 3: uSDHC3 eMMC -->
  <rect x="960" y="100" width="410" height="540" rx="14" fill="#0b1f3d" stroke="#3b82f6"/>
  <text class="hd" x="1165" y="130" text-anchor="middle" style="fill:#93c5fd">uSDHC3</text><text class="xs mono" x="1165" y="148" text-anchor="middle" style="fill:#93c5fd">0x30B6_0000</text>
  <text class="nm" x="1165" y="206" text-anchor="middle">eMMC on the module</text><text class="xs" x="1165" y="224" text-anchor="middle" style="fill:#9fb0c6">29 GiB on your VAR-SOM, HS400</text>
  <rect x="1010" y="262" width="310" height="30" rx="15" fill="#1d4ed8"/><text class="sm" x="1165" y="282" text-anchor="middle" style="fill:#fff">boot switch = eMMC → reads it</text>
  <text class="nm mono" x="1165" y="350" text-anchor="middle">mmc 2</text><text class="xs mono" x="1165" y="368" text-anchor="middle" style="fill:#9fb0c6">emmc_dev=2 · mmcdev=2 when booted from eMMC</text>
  <text class="nm mono" x="1165" y="418" text-anchor="middle">/dev/mmcblk2</text>
  <text class="xs mono" x="1165" y="438" text-anchor="middle" style="fill:#9fb0c6">├ mmcblk2boot0, boot1 (4 MiB hw partitions)</text>
  <text class="xs mono" x="1165" y="454" text-anchor="middle" style="fill:#9fb0c6">└ mmcblk2rpmb (replay-protected, for secure storage)</text>
  <rect x="980" y="490" width="22" height="34" fill="#475569"/>
  <rect x="1002" y="490" width="10" height="34" fill="#1d2a45"/>
  <rect x="1012" y="490" width="110" height="34" fill="#2563eb"/><text class="xs" x="1067" y="511" text-anchor="middle" style="fill:#fff;font-weight:700">imx-boot.bin</text>
  <rect x="1122" y="490" width="20" height="34" fill="#1d2a45"/>
  <rect x="1142" y="490" width="24" height="34" fill="#94a3b8"/>
  <rect x="1166" y="490" width="184" height="34" fill="#1d4ed8"/><text class="xs" x="1258" y="511" text-anchor="middle" style="fill:#fff;font-weight:700">p1 ext4 "root"</text>
  <text class="xs" x="1165" y="560" text-anchor="middle" style="fill:#9fb0c6">same image, user area: booted from SD, run</text>
  <text class="xs mono" x="1165" y="578" text-anchor="middle" style="fill:#93c5fd">dd if=sdcard.img of=/dev/mmcblk2 bs=4M</text>
  <text class="xs" x="1165" y="598" text-anchor="middle" style="fill:#9fb0c6">U-Boot then passes root=/dev/mmcblk2p1 by itself</text>
  <text class="xs" x="1165" y="620" text-anchor="middle" style="fill:#fb7185">blank on your board today: no partition table</text>

  <text class="sm" x="30" y="676" style="fill:#9fb0c6">Check on the board:  cat /proc/partitions  ·  ls -l /sys/block/mmcblk*/device/../..  ·  dmesg | grep -E "mmc[0-2]"   ·   in U-Boot:  mmc list</text>
<g id="icons"><g transform="translate(186,116) scale(1)" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" /> <path d="M2 8.82a15 15 0 0 1 20 0" /> <path d="M5 12.859a10 10 0 0 1 14 0" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /></g><g transform="translate(546,116) scale(1)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01" /> <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /> <path d="M21.946 12.013H2.054" /> <path d="M6 16h.01" /></g><g transform="translate(976,116) scale(1)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h4" /> <path d="M10 17h4" /> <path d="M10 7h4" /> <path d="M18 12h2" /> <path d="M18 18h2" /> <path d="M18 6h2" /> <path d="M4 12h2" /> <path d="M4 18h2" /> <path d="M4 6h2" /> <rect x="6" y="2" width="12" height="20" rx="2" /></g></g><!--/icons--></svg>
