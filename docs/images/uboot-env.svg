<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="The four layers of U-Boot's environment, lowest to highest priority: the compiled-in default from the board's .env file; the saved environment at 7 MiB on the boot device, which replaces the default when its CRC is valid; /boot/uEnv.txt, imported every boot to override selected variables; and values typed at the U-Boot prompt. On this board only the compiled-in default was used."><rect x="0" y="0" width="1400" height="760" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker><marker id="m-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">Where U-Boot's variables come from</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Four layers, later ones win. bootcmd, fdt_file, console, kernelargs … each one can come from any layer.</text><rect x="32" y="548" width="900" height="116" rx="14" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.6"/><rect x="32" y="548" width="70" height="116" rx="14" fill="#2563eb"/><text x="67" y="598" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="28" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">1</text><g transform="translate(55,614) scale(1)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="4" height="6" rx="2" /> <rect x="6" y="4" width="4" height="6" rx="2" /> <path d="M6 20h4" /> <path d="M14 10h4" /> <path d="M6 14h2v6" /> <path d="M14 4h2v6" /></g><text x="120" y="578" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#93c5fd;white-space:pre">Compiled-in default</text><text x="120" y="600" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">board/variscite/imx8mp_var_dart/imx8mp_var_dart.env → baked into u-boot.bin</text><rect x="120" y="610" width="420" height="33" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="134" y="632" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">build/deploy/u-boot-initial-env   (read it!)</text><rect x="562" y="620" width="316.7" height="23.5" rx="11.75" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.2"/><text x="720.35" y="634.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="700" text-anchor="middle" style="fill:#93c5fd;white-space:pre">always there; used when nothing else exists</text><rect x="58" y="416" width="874" height="116" rx="14" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.6"/><rect x="58" y="416" width="70" height="116" rx="14" fill="#d97706"/><text x="93" y="466" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="28" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">2</text><g transform="translate(81,482) scale(1)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01" /> <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /> <path d="M21.946 12.013H2.054" /> <path d="M6 16h.01" /></g><text x="146" y="446" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#fcd34d;white-space:pre">Saved environment</text><text x="146" y="468" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">16 KiB at 7 MiB on the boot device (CONFIG_ENV_OFFSET = 0x700000), CRC-protected</text><rect x="146" y="478" width="420" height="50" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="160" y="500" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">u-boot=&gt; saveenv            (write)</text><text x="160" y="517" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">u-boot=&gt; env default -a; saveenv   (reset)</text><rect x="588" y="488" width="261.5" height="23.5" rx="11.75" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.2"/><text x="718.75" y="502.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="700" text-anchor="middle" style="fill:#fcd34d;white-space:pre">if valid, REPLACES layer 1 entirely</text><rect x="84" y="284" width="848" height="116" rx="14" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.6"/><rect x="84" y="284" width="70" height="116" rx="14" fill="#7c3aed"/><text x="119" y="334" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="28" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">3</text><g transform="translate(107,350) scale(1)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></g><text x="172" y="314" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/boot/uEnv.txt</text><text x="172" y="336" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">plain-text name=value file on partition 1, imported by bsp_bootcmd every boot</text><rect x="172" y="346" width="420" height="50" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="186" y="368" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">fdt_file=imx8mp-var-som-symphony.dtb</text><text x="186" y="385" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">kernelargs=loglevel=8</text><rect x="614" y="356" width="275.3" height="23.5" rx="11.75" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.2"/><text x="751.65" y="370.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="700" text-anchor="middle" style="fill:#c4b5fd;white-space:pre">overrides just the variables it lists</text><rect x="110" y="152" width="822" height="116" rx="14" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.6"/><rect x="110" y="152" width="70" height="116" rx="14" fill="#e11d48"/><text x="145" y="202" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="28" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">4</text><g transform="translate(133,218) scale(1)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8h.01" /> <path d="M12 12h.01" /> <path d="M14 8h.01" /> <path d="M16 12h.01" /> <path d="M18 8h.01" /> <path d="M6 8h.01" /> <path d="M7 16h10" /> <path d="M8 12h.01" /> <rect width="20" height="16" x="2" y="4" rx="2" /></g><text x="198" y="182" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="16" font-weight="800" text-anchor="start" style="fill:#fda4af;white-space:pre">Typed at the prompt</text><text x="198" y="204" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">stop autoboot with any key, then setenv / printenv / run</text><rect x="198" y="214" width="420" height="50" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="212" y="236" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">u-boot=&gt; setenv kernelargs quiet</text><text x="212" y="253" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#cbd5e1;white-space:pre">u-boot=&gt; boot</text><rect x="640" y="224" width="233.9" height="23.5" rx="11.75" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.2"/><text x="756.95" y="238.5" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="700" text-anchor="middle" style="fill:#fda4af;white-space:pre">until reset, unless you saveenv</text><line x1="970" y1="664" x2="970" y2="132" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" marker-end="url(#m-b)"/><text x="988" y="400" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="800" text-anchor="start" style="fill:#93c5fd;white-space:pre">wins</text><text x="988" y="420" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">over the</text><text x="988" y="438" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">layers below</text><rect x="1100" y="116" width="270" height="548" rx="14" fill="#050a14" stroke="#334155" stroke-width="1.2"/><g transform="translate(1118,132) scale(0.916667)" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2" /> <path d="M11 13h4" /> <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /></g><text x="1150" y="149" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" style="fill:#9fb0c6;white-space:pre" letter-spacing="1.3">ON YOUR BOARD</text><text x="1118" y="186" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">First boot said:</text><rect x="1118" y="196" width="236" height="70" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="1132" y="218" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">*** Warning - bad CRC,</text><text x="1132" y="236" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">using default</text><text x="1132" y="254" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">environment</text><text x="1118" y="290" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">→ layer 2 is empty: nothing</text><text x="1118" y="309" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">  was ever saved. Normal.</text><text x="1118" y="328" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre"></text><text x="1118" y="347" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Then:</text><rect x="1118" y="352" width="236" height="52" rx="10" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="1132" y="374" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">Failed to load</text><text x="1132" y="392" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">'/boot/uEnv.txt'</text><text x="1118" y="420" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">→ no layer 3 either.</text><text x="1118" y="439" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre"></text><text x="1118" y="458" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">So every value came from</text><text x="1118" y="477" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">layer 1: the defaults</text><text x="1118" y="496" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">this repo compiled.</text><text x="1118" y="515" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre"></text><text x="1118" y="534" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">From Linux: fw_printenv</text><text x="1118" y="553" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">(apt install libubootenv-tool</text><text x="1118" y="572" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre"> + /etc/fw_env.config)</text><text x="32" y="700" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Safest way to experiment: put one line in /boot/uEnv.txt (mount the card on your PC, or edit it on the board) and reboot. Delete the file to undo.</text><text x="32" y="722" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Factory reset of a board whose saved environment you broke: stop autoboot, then  env default -a; saveenv; reset.</text></svg>
