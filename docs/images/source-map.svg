nt-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">drivers/firmware/psci/psci.c</text><text x="784" y="804" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">psci_0_2_cpu_on() → arm_smccc_smc(): the smc to BL31</text><rect x="200" y="822" width="560" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="214" y="842" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">drivers/of/platform.c · drivers/i2c/busses/i2c-imx.c</text><text x="784" y="842" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">DT nodes → devices; the I2C controller driver</text><rect x="200" y="860" width="560" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="214" y="880" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">drivers/rtc/rtc-ds1307.c</text><text x="784" y="880" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">of_match_table + ds1307_probe(): the board's RTC</text><rect x="200" y="898" width="560" height="30" rx="8" fill="#050a14" stroke="#334155" stroke-width="1.2"/><text x="214" y="918" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">init/main.c</text><text x="784" y="918" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">kernel_init(): run_init_process("/sbin/init")</text><text x="32" y="988" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Each file is explained, with the real code, in docs/15-source-tour.md. Grep tips: grep -rn "bsp_bootcmd" build/src/uboot-imx/board/variscite/ ·</text><text x="32" y="1008" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">grep -rn "dallas,ds1337" build/src/linux-imx/drivers/ · grep -rn "IMX_SIP_" build/src/imx-atf/plat/imx/</text></svg>
