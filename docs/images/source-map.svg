<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-label="Source files that run during boot, in order: in uboot-imx the SPL's board_init_f, spl_dram_init, ddr_init, enable_tzc380 and the FIT loader; in imx-atf bl31_main, the i.MX8MP BL31 setup, the PSCI power-on code and the SiP services; back in uboot-imx the board's board_late_init, its default environment and booti; in linux-imx head.S, the PSCI driver, the device-tree platform code with the I2C and RTC drivers, and init/main.c, which starts /sbin/init."><rect x="0" y="0" width="1400" height="1050" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">The code that runs, in order: power-on to /sbin/init</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">The files to open when you want to understand or change a step. Paths are inside build/src/ after a build.</text><rect x="32" y="100" width="1336" height="220" rx="14" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.6"/><rect x="32" y="100" width="150" height="220" rx="14" fill="#2563eb"/><text x="107" y="206" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="18" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">SPL</text><text x="107" y="228" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12" font-weight="400" text-anchor="middle" style="fill:#e2e8f0;white-space:pre">uboot-imx</text><