<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="From kernel start to the login prompt: the kernel brings up four CPUs through PSCI, probes built-in drivers, waits for the SD card, mounts the ext4 root at 3.4 seconds and starts /sbin/init. Then the two root filesystems do the same jobs with different tools: Alpine's BusyBox init runs mounts, syslogd and klogd, mdev, coldplug for kernel modules, hwclock and a serial getty from /etc/inittab, while Debian's systemd uses fstab, journald, udev, networkd and resolved, ssh and serial-getty.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; fill: #e5edf7; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .t { font-size: 25px; font-weight: 700; }
    .st { font-size: 14px; }
    .col { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .nm { font-size: 13px; font-weight: 700; }
    .sm { font-size: 11.5px; }
    .ts { font-size: 11px; font-weight: 700; }
    .job { font-size: 12px; font-weight: 700; }
  </style>
  <rect width="1400" height="820" rx="18" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="1399" height="819" rx="18" fill="none" stroke="#1e2a44"/>
  <text class="t" x="30" y="44">From "Starting kernel" to "login:"</text>
  <text class="st" x="30" y="68" style="fill:#9fb0c6">The kernel's job ends when it starts PID 1. After that, Alpine and Debian do the same jobs with different tools.</text>

  <!-- ===== kernel timeline ===== -->
  <text class="col" x="30" y="106" style="fill:#9fb0c6">THE KERNEL · timestamps from this board's dmesg</text>
  <line x1="60" y1="170" x2="1340" y2="170" stroke="#2dd4bf" stroke-width="4.0" stroke-linecap="round"/>
  <g>
    <circle cx="80" cy="170" r="8" fill="#0f766e"/><text class="ts mono" x="80" y="150" text-anchor="middle" style="fill:#5eead4">0.000 s</text>
    <text class="nm" x="80" y="200" text-anchor="middle">Booting Linux</text><text class="sm" x="80" y="216" text-anchor="middle" style="fill:#9fb0c6">reads DTB, cmdline,</text><text class="sm" x="80" y="231" text-anchor="middle" style="fill:#9fb0c6">reserves memory</text>
    <circle cx="300" cy="170" r="8" fill="#0f766e"/><text class="ts mono" x="300" y="150" text-anchor="middle" style="fill:#5eead4">0.006 s</text>
    <text class="nm" x="300" y="200" text-anchor="middle">4 CPUs up</text><text class="sm" x="300" y="216" text-anchor="middle" style="fill:#9fb0c6">PSCI CPU_ON via</text><text class="sm" x="300" y="231" text-anchor="middle" style="fill:#9fb0c6">smc → BL31</text>
    <circle cx="560" cy="170" r="8" fill="#0f766e"/><text class="ts mono" x="560" y="150" text-anchor="middle" style="fill:#5eead4">0.05 – 3.2 s</text>
    <text class="nm" x="560" y="200" text-anchor="middle">built-in drivers probe</text><text class="sm" x="560" y="216" text-anchor="middle" style="fill:#9fb0c6">UART, I2C, PMIC, eMMC, GPU,</text><text class="sm" x="560" y="231" text-anchor="middle" style="fill:#9fb0c6">display (penguins), Ethernet</text>
    <circle cx="830" cy="170" r="8" fill="#0f766e"/><text class="ts mono" x="830" y="150" text-anchor="middle" style="fill:#5eead4">3.26 s</text>
    <text class="nm" x="830" y="200" text-anchor="middle">Waiting for root device</text><text class="sm mono" x="830" y="216" text-anchor="middle" style="fill:#9fb0c6">root=/dev/mmcblk1p1</text><text class="sm" x="830" y="231" text-anchor="middle" style="fill:#9fb0c6">rootwait: until SD is ready</text>
    <circle cx="1060" cy="170" r="8" fill="#0f766e"/><text class="ts mono" x="1060" y="150" text-anchor="middle" style="fill:#5eead4">3.40 s</text>
    <text class="nm" x="1060" y="200" text-anchor="middle">EXT4 mounted r/w</text><text class="sm" x="1060" y="216" text-anchor="middle" style="fill:#9fb0c6">the SD card's p1</text><text class="sm" x="1060" y="231" text-anchor="middle" style="fill:#9fb0c6">becomes /</text>
    <circle cx="1280" cy="170" r="10" fill="#e5edf7"/><text class="ts mono" x="1280" y="150" text-anchor="middle">3.44 s</text>
    <text class="nm" x="1280" y="200" text-anchor="middle">Run /sbin/init</text><text class="sm" x="1280" y="216" text-anchor="middle" style="fill:#9fb0c6">PID 1: userspace</text><text class="sm" x="1280" y="231" text-anchor="middle" style="fill:#9fb0c6">takes over</text>
  </g>
  <path d="M1280,240 V262 H700 V278" fill="none" stroke="#e5edf7" stroke-width="2.7" marker-end="url(#a)"/>

  <!-- ===== comparison ===== -->
  <text class="col" x="30" y="300" style="fill:#9fb0c6">THEN, PID 1</text>
  <rect x="240" y="286" width="540" height="40" rx="10" fill="#0b3a36" stroke="#14b8a6"/>
  <text class="nm" x="256" y="305" style="fill:#5eead4">Alpine · BusyBox init</text><text class="sm mono" x="256" y="320" style="fill:#5eead4">reads /etc/inittab, top to bottom</text>
  <rect x="800" y="286" width="570" height="40" rx="10" fill="#1e1b4b" stroke="#6366f1"/>
  <text class="nm" x="816" y="305" style="fill:#a5b4fc">Debian · systemd</text><text class="sm mono" x="816" y="320" style="fill:#a5b4fc">starts units in parallel, by dependency</text>

  <g>
    <!-- rows: job label | alpine | debian -->
    <rect x="30" y="338" width="1340" height="50" rx="8" fill="#0f192d"/>
    <text class="job" x="46" y="368">Mount /proc /sys /dev</text>
    <text class="sm mono" x="256" y="361">mount -t proc · sysfs · devpts</text><text class="sm" x="256" y="378" style="fill:#9fb0c6">remount / read-write</text>
    <text class="sm mono" x="816" y="361">systemd built-in + /etc/fstab</text><text class="sm" x="816" y="378" style="fill:#9fb0c6">LABEL=root / ext4 noatime</text>

    <rect x="30" y="394" width="1340" height="50" rx="8" fill="#121c33"/>
    <text class="job" x="46" y="424">System log</text>
    <text class="sm mono" x="256" y="417">syslogd -C512 + klogd</text><text class="sm" x="256" y="434" style="fill:#9fb0c6">RAM ring buffer → logread</text>
    <text class="sm mono" x="816" y="417">systemd-journald</text><text class="sm" x="816" y="434" style="fill:#9fb0c6">→ journalctl -b</text>

    <rect x="30" y="450" width="1340" height="50" rx="8" fill="#0f192d"/>
    <text class="job" x="46" y="480">Device nodes, permissions</text>
    <text class="sm mono" x="256" y="473">mdev -s  +  /etc/mdev.conf</text><text class="sm" x="256" y="490" style="fill:#9fb0c6">/dev/null 666, rest root-only</text>
    <text class="sm mono" x="816" y="473">systemd-udevd + rules</text><text class="sm" x="816" y="490" style="fill:#9fb0c6">groups: dialout, video, audio …</text>

    <rect x="30" y="506" width="1340" height="50" rx="8" fill="#121c33"/>
    <text class="job" x="46" y="536">Load kernel modules</text>
    <text class="sm mono" x="256" y="529">/sbin/coldplug  ·  mdev -d</text><text class="sm" x="256" y="546" style="fill:#9fb0c6">modalias → modprobe (27 on VAR-SOM)</text>
    <text class="sm mono" x="816" y="529">systemd-udevd</text><text class="sm" x="816" y="546" style="fill:#9fb0c6">same modalias mechanism, automatic</text>

    <rect x="30" y="562" width="1340" height="50" rx="8" fill="#0f192d"/>
    <text class="job" x="46" y="592">Clock</text>
    <text class="sm mono" x="256" y="585">hwclock -u -s  (and -w at shutdown)</text><text class="sm" x="256" y="602" style="fill:#9fb0c6">RTC DS1337 ↔ system time</text>
    <text class="sm mono" x="816" y="585">systemd-timesyncd (NTP)</text><text class="sm" x="816" y="602" style="fill:#9fb0c6">RTC driver loaded by udev; hwclock in util-linux-extra</text>

    <rect x="30" y="618" width="1340" height="50" rx="8" fill="#121c33"/>
    <text class="job" x="46" y="648">Network, remote login</text>
    <text class="sm mono" x="256" y="641">udhcpc -i eth1  (by hand)</text><text class="sm" x="256" y="658" style="fill:#9fb0c6">apk add openssh for ssh</text>
    <text class="sm mono" x="816" y="641">systemd-networkd + resolved, ssh</text><text class="sm" x="816" y="658" style="fill:#9fb0c6">DHCP on end0/end1, unique host keys</text>

    <rect x="30" y="674" width="1340" height="56" rx="8" fill="#060b16"/>
    <text class="job" x="46" y="707" style="fill:#fff">login: prompt</text>
    <text class="sm mono" x="256" y="697" style="fill:#a7f3d0">console-getty → console= from cmdline</text><text class="sm mono" x="256" y="716" style="fill:#a7f3d0">getty tty1 (screen)</text>
    <text class="sm mono" x="816" y="697" style="fill:#c7d2fe">serial-getty@ttymxc1 (from console=)</text><text class="sm mono" x="816" y="716" style="fill:#c7d2fe">getty@tty1 (screen)</text>
  </g>
  <line x1="240" y1="338" x2="240" y2="730" stroke="#e2e8f0"/>
  <line x1="800" y1="338" x2="800" y2="730" stroke="#e2e8f0"/>

  <text class="sm" x="30" y="764" style="fill:#9fb0c6">Alpine: everything above is ~15 lines in /etc/inittab (see docs/05-rootfs.md).</text>
  <text class="sm" x="30" y="784" style="fill:#9fb0c6">Debian: the same jobs are systemd units. List them on the board with  systemctl list-units  and see timing with  systemd-analyze blame.</text>
