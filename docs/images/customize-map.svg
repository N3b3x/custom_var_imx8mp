<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Where to make changes and where they end up: config/local.conf affects every script; patches for U-Boot, TF-A and the kernel are applied by their build steps and end up in imx-boot.bin or the kernel; kernel config fragments and custom device trees go through kernel.sh into /boot; debian-customize.sh shapes the Debian root filesystem; /boot/uEnv.txt on the card changes boot settings without rebuilding."><rect x="0" y="0" width="1400" height="700" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">Where your changes go, and where they end up</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Never edit build/src/ directly (it's disposable). Put changes in these places; the build picks them up.</text><text x="52" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" style="fill:#9fb0c6;white-space:pre" letter-spacing="1.3">YOU EDIT</text><text x="700" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" style="fill:#9fb0c6;white-space:pre" letter-spacing="1.3">CONSUMED BY</text><text x="1000" y="112" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="800" text-anchor="start" style="fill:#9fb0c6;white-space:pre" letter-spacing="1.3">ENDS UP IN</text><rect x="32" y="126" width="600" height="52" rx="12" fill="#2a1b05" stroke="#f59e0b" stroke-width="1.4"/><g transform="translate(46,140) scale(1)" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5" /> <path d="M19 7h-9" /> <circle cx="17" cy="17" r="3" /> <circle cx="7" cy="7" r="3" /></g><text x="82" y="148" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#fcd34d;white-space:pre">config/local.conf</text><text x="82" y="167" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">versions, passwords, packages, hostname, BUILD_DIR</text><line x1="636" y1="152" x2="690" y2="152" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="134" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="157" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">every script</text><line x1="958" y1="152" x2="994" y2="152" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="134" width="370" height="36" rx="10" fill="#121c33" stroke="#f59e0b" stroke-width="1.2"/><text x="1014" y="157" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#fcd34d;white-space:pre">everything</text><rect x="32" y="190" width="600" height="52" rx="12" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.4"/><g transform="translate(46,204) scale(1)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3" /> <circle cx="18" cy="6" r="3" /> <circle cx="6" cy="18" r="3" /></g><text x="82" y="212" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#93c5fd;white-space:pre">patches/uboot/*.patch</text><text x="82" y="231" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">U-Boot source changes (git format-patch)</text><line x1="636" y1="216" x2="690" y2="216" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="198" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="221" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">uboot.sh step 3</text><line x1="958" y1="216" x2="994" y2="216" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="198" width="370" height="36" rx="10" fill="#121c33" stroke="#3b82f6" stroke-width="1.2"/><text x="1014" y="221" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#93c5fd;white-space:pre">imx-boot.bin @ 32 KiB</text><rect x="32" y="254" width="600" height="52" rx="12" fill="#2a0f1d" stroke="#f43f5e" stroke-width="1.4"/><g transform="translate(46,268) scale(1)" fill="none" stroke="#fda4af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3" /> <circle cx="18" cy="6" r="3" /> <circle cx="6" cy="18" r="3" /></g><text x="82" y="276" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#fda4af;white-space:pre">patches/atf/*.patch</text><text x="82" y="295" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">TF-A source changes</text><line x1="636" y1="280" x2="690" y2="280" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="262" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="285" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">uboot.sh step 2</text><line x1="958" y1="280" x2="994" y2="280" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="262" width="370" height="36" rx="10" fill="#121c33" stroke="#f43f5e" stroke-width="1.2"/><text x="1014" y="285" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#fda4af;white-space:pre">imx-boot.bin → BL31</text><rect x="32" y="318" width="600" height="52" rx="12" fill="#06231f" stroke="#14b8a6" stroke-width="1.4"/><g transform="translate(46,332) scale(1)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a9 9 0 0 0-9 9V3" /> <circle cx="18" cy="6" r="3" /> <circle cx="6" cy="18" r="3" /></g><text x="82" y="340" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#5eead4;white-space:pre">patches/kernel/*.patch</text><text x="82" y="359" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">kernel / driver source changes</text><line x1="636" y1="344" x2="690" y2="344" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="326" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="349" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">kernel.sh</text><line x1="958" y1="344" x2="994" y2="344" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="326" width="370" height="36" rx="10" fill="#121c33" stroke="#14b8a6" stroke-width="1.2"/><text x="1014" y="349" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#5eead4;white-space:pre">/boot/Image.gz, modules</text><rect x="32" y="382" width="600" height="52" rx="12" fill="#06231f" stroke="#14b8a6" stroke-width="1.4"/><g transform="translate(46,396) scale(1)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8a1 1 0 0 1-1-1V2a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8z" /> <path d="M20 8v12a2 2 0 0 1-2 2h-4.182" /> <path d="m3.305 19.53.923-.382" /> <path d="M4 10.592V4a2 2 0 0 1 2-2h8" /> <path d="m4.228 16.852-.924-.383" /> <path d="m5.852 15.228-.383-.923" /> <path d="m5.852 20.772-.383.924" /> <path d="m8.148 15.228.383-.923" /> <path d="m8.53 21.696-.382-.924" /> <path d="m9.773 16.852.922-.383" /> <path d="m9.773 19.148.922.383" /> <circle cx="7" cy="18" r="3" /></g><text x="82" y="404" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#5eead4;white-space:pre">config/kernel/*.cfg</text><text x="82" y="423" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">kernel options (CONFIG_FOO=y)</text><line x1="636" y1="408" x2="690" y2="408" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="390" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="413" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">kernel.sh config</text><line x1="958" y1="408" x2="994" y2="408" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="390" width="370" height="36" rx="10" fill="#121c33" stroke="#14b8a6" stroke-width="1.2"/><text x="1014" y="413" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#5eead4;white-space:pre">/boot/Image.gz, modules</text><rect x="32" y="446" width="600" height="52" rx="12" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.4"/><g transform="translate(46,460) scale(1)" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></g><text x="82" y="468" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#c4b5fd;white-space:pre">custom/dts/*.dts</text><text x="82" y="487" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">your carrier board's device tree</text><line x1="636" y1="472" x2="690" y2="472" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="454" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="477" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">kernel.sh dtbs</text><line x1="958" y1="472" x2="994" y2="472" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="454" width="370" height="36" rx="10" fill="#121c33" stroke="#8b5cf6" stroke-width="1.2"/><text x="1014" y="477" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/boot/&lt;name&gt;.dtb</text><rect x="32" y="510" width="600" height="52" rx="12" fill="#1d1640" stroke="#8b5cf6" stroke-width="1.4"/><g transform="translate(46,524) scale(1)" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h-5" /> <path d="M15 8h-5" /> <path d="M19 17V5a2 2 0 0 0-2-2H4" /> <path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3" /></g><text x="82" y="532" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#c4b5fd;white-space:pre">scripts/rootfs/debian-customize.sh</text><text x="82" y="551" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">users, network, services (Debian)</text><line x1="636" y1="536" x2="690" y2="536" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="518" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="541" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">rootfs.sh</text><line x1="958" y1="536" x2="994" y2="536" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="518" width="370" height="36" rx="10" fill="#121c33" stroke="#8b5cf6" stroke-width="1.2"/><text x="1014" y="541" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/ on partition 1</text><rect x="32" y="574" width="600" height="52" rx="12" fill="#0c1d3d" stroke="#3b82f6" stroke-width="1.4"/><g transform="translate(46,588) scale(1)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></g><text x="82" y="596" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="800" text-anchor="start" style="fill:#93c5fd;white-space:pre">/boot/uEnv.txt (on the card)</text><text x="82" y="615" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">boot-time overrides: fdt_file, kernelargs</text><line x1="636" y1="600" x2="690" y2="600" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="694" y="582" width="260" height="36" rx="10" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><text x="710" y="605" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">U-Boot at boot</text><line x1="958" y1="600" x2="994" y2="600" stroke="#e5edf7" stroke-width="2.6" stroke-linecap="round" marker-end="url(#m-a)"/><rect x="998" y="582" width="370" height="36" rx="10" fill="#121c33" stroke="#3b82f6" stroke-width="1.2"/><text x="1014" y="605" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="700" text-anchor="start" style="fill:#93c5fd;white-space:pre">no rebuild needed</text><text x="32" y="660" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Then rebuild only what changed: ./build.sh uboot | kernel | rootfs, then ./build.sh image, or update a card in place with flash --kernel-only / --bootloader-only.</text></svg>
