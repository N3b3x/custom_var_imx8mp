<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="On the running board, the ext4 root filesystem on the SD card holds /boot, /lib/modules, /lib/firmware, /sbin/init, /etc and programs, while /proc, /sys and /dev are virtual: procfs exposes processes and kernel state, sysfs exposes the device model, and devtmpfs with mdev or udev provides device nodes such as /dev/mmcblk1p1, /dev/ttymxc1 and /dev/rtc0. Examples are real values from this board."><rect x="0" y="0" width="1400" height="820" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">The running system: real files vs. live kernel views</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">/ on the SD card holds programs and config. /proc, /sys and /dev are not on any disk: the kernel generates them as you read.</text><rect x="32" y="104" width="430" height="640" rx="12" fill="#121c33" stroke="#8b5cf6" stroke-width="1.6"/><path d="M32,116 a12,12 0 0 1 12,-12 h406 a12,12 0 0 1 12,12 v28 h-430 z" fill="#7c3aed"/><g transform="translate(44,113) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01" /> <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /> <path d="M21.946 12.013H2.054" /> <path d="M6 16h.01" /></g><text x="76" y="129" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">On the SD card (ext4, mmcblk1p1)</text><rect x="48" y="160" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="184" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/boot</text><text x="62" y="204" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Image.gz, 47 DTBs: what U-Boot loads</text><rect x="48" y="230" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="254" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/lib/modules/6.18.20-custom</text><text x="62" y="274" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">the .ko drivers + modules.alias</text><rect x="48" y="300" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="324" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/lib/firmware/imx</text><text x="62" y="344" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">SDMA/audio firmware the drivers request</text><rect x="48" y="370" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="394" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/sbin/init</text><text x="62" y="414" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">PID 1 (BusyBox or systemd)</text><rect x="48" y="440" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="464" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/etc</text><text x="62" y="484" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">inittab, fstab, hostname, network, ssh</text><rect x="48" y="510" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="534" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/bin  /usr</text><text x="62" y="554" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">programs and libraries</text><rect x="48" y="580" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="604" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/root  /home</text><text x="62" y="624" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">user files</text><rect x="48" y="650" width="398" height="58" rx="10" fill="#0f192d" stroke="#26344f" stroke-width="1.2"/><text x="62" y="674" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="13.5" font-weight="700" text-anchor="start" style="fill:#c4b5fd;white-space:pre">/var/log</text><text x="62" y="694" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">logs (Debian; Alpine logs to RAM)</text><rect x="520" y="104" width="848" height="202" rx="12" fill="#121c33" stroke="#14b8a6" stroke-width="1.6"/><path d="M520,116 a12,12 0 0 1 12,-12 h824 a12,12 0 0 1 12,12 v28 h-848 z" fill="#0d9488"/><g transform="translate(532,113) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2" /> <path d="M12 2v2" /> <path d="M17 20v2" /> <path d="M17 2v2" /> <path d="M2 12h2" /> <path d="M2 17h2" /> <path d="M2 7h2" /> <path d="M20 12h2" /> <path d="M20 17h2" /> <path d="M20 7h2" /> <path d="M7 20v2" /> <path d="M7 2v2" /> <rect x="4" y="4" width="16" height="16" rx="2" /> <rect x="8" y="8" width="8" height="8" rx="1" /></g><text x="564" y="129" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">/proc   procfs · processes + kernel state</text><text x="540" y="166" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">cat /proc/cmdline</text><text x="1000" y="166" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">console=ttymxc1,115200 root=/dev/mmcblk1p1 …</text><text x="540" y="200" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">cat /proc/cpuinfo</text><text x="1000" y="200" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">4 × Cortex-A53</text><text x="540" y="234" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">ls /proc/1/</text><text x="1000" y="234" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">everything about PID 1</text><text x="540" y="268" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">cat /proc/meminfo</text><text x="1000" y="268" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#5eead4;white-space:pre">MemTotal, CmaTotal …</text><rect x="520" y="322" width="848" height="202" rx="12" fill="#121c33" stroke="#3b82f6" stroke-width="1.6"/><path d="M520,334 a12,12 0 0 1 12,-12 h824 a12,12 0 0 1 12,12 v28 h-848 z" fill="#2563eb"/><g transform="translate(532,331) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z" /> <path d="m7 16.5-4.74-2.85" /> <path d="m7 16.5 5-3" /> <path d="M7 16.5v5.17" /> <path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z" /> <path d="m17 16.5-5-3" /> <path d="m17 16.5 4.74-2.85" /> <path d="M17 16.5v5.17" /> <path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z" /> <path d="M12 8 7.26 5.15" /> <path d="m12 8 4.74-2.85" /> <path d="M12 13.5V8" /></g><text x="564" y="347" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">/sys   sysfs · the device model</text><text x="540" y="384" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/sys/class/thermal/thermal_zone0/temp</text><text x="1000" y="384" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">57000 = 57 °C</text><text x="540" y="418" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/sys/bus/i2c/devices/3-0068</text><text x="1000" y="418" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">the RTC, from the DTB</text><text x="540" y="452" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/sys/class/net/eth1/carrier</text><text x="1000" y="452" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">1 = cable in</text><text x="540" y="486" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/sys/firmware/devicetree/base</text><text x="1000" y="486" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#93c5fd;white-space:pre">the DTB U-Boot passed</text><rect x="520" y="540" width="848" height="202" rx="12" fill="#121c33" stroke="#f59e0b" stroke-width="1.6"/><path d="M520,552 a12,12 0 0 1 12,-12 h824 a12,12 0 0 1 12,12 v28 h-848 z" fill="#d97706"/><g transform="translate(532,549) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="1" /> <circle cx="4" cy="20" r="1" /> <path d="M4.7 19.3 19 5" /> <path d="m21 3-3 1 2 2Z" /> <path d="M9.26 7.68 5 12l2 5" /> <path d="m10 14 5 2 3.5-3.5" /> <path d="m18 12 1-1 1 1-1 1Z" /></g><text x="564" y="565" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14.5" font-weight="800" text-anchor="start" style="fill:#ffffff;white-space:pre">/dev   devtmpfs + mdev/udev · device nodes</text><text x="540" y="602" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/dev/mmcblk1p1</text><text x="1000" y="602" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">the SD card's root partition</text><text x="540" y="636" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/dev/ttymxc1</text><text x="1000" y="636" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">the serial console</text><text x="540" y="670" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/dev/rtc0  /dev/i2c-3</text><text x="1000" y="670" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">created when drivers probe</text><text x="540" y="704" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">/dev/null  /dev/zero</text><text x="1000" y="704" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#fcd34d;white-space:pre">666: usable by everyone</text><line x1="464" y1="420" x2="516" y2="420" stroke="#e5edf7" stroke-width="3.2" stroke-linecap="round" marker-end="url(#m-a)"/><text x="468" y="410" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">mounts</text><text x="32" y="772" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">init mounts them at boot (mount -t proc / sysfs / devtmpfs). Reading a file there asks the kernel a question; writing one (e.g. echo to /sys/class/leds/…)</text><text x="32" y="792" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">changes hardware state. That's how most of the commands in 11 · Using the board work: ps reads /proc, free reads /proc/meminfo, ip talks to the kernel.</text></svg>
