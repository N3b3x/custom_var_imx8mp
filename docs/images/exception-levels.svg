<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Arm exception levels on the i.MX 8M Plus at runtime: TF-A BL31 alone at EL3 owns the switch between worlds; the normal world has U-Boot or the Linux hypervisor stub at EL2, the Linux kernel at EL1 and applications at EL0; the secure world would have OP-TEE at S-EL1 and trusted applications at S-EL0, which this build does not include. Arrows show the instructions that cross levels: svc, hvc, smc and eret.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0f192d"/><line x1="0" y1="0" x2="0" y2="8" stroke="#22304d" stroke-width="3"/></pattern>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; fill: #e5edf7; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .t { font-size: 25px; font-weight: 700; }
    .st { font-size: 14px; fill: #9fb0c6; }
    .el { font-size: 17px; font-weight: 800; fill: #fff; }
    .elsub { font-size: 10.5px; fill: #fff; }
    .col { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; }
    .nm { font-size: 15px; font-weight: 700; }
    .sm { font-size: 12px; fill: #9fb0c6; }
    .ins { font-size: 12px; font-weight: 700; }
    .log { font-size: 11.5px; fill: #e5edf7; }
    .exp { font-size: 12px; fill: #9fb0c6; }
  </style>
  <rect width="1400" height="720" rx="18" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="1399" height="719" rx="18" fill="none" stroke="#1e2a44"/>

  <text class="t" x="30" y="44">Who runs where: exception levels and the two worlds</text>
  <text class="st" x="30" y="68">Higher EL = more privilege. Only code at EL3 can move the CPU between the normal and the secure world.</text>

  <text class="col" x="150" y="106" style="fill:#fda4af">SECURE WORLD</text>
  <text class="col" x="560" y="106" style="fill:#6ee7b7">NORMAL (NON-SECURE) WORLD</text>

  <!-- EL labels -->
  <rect x="30" y="120" width="100" height="90" rx="12" fill="#9f1239"/><text class="el" x="80" y="160" text-anchor="middle">EL3</text><text class="elsub" x="80" y="180" text-anchor="middle">most privileged</text>
  <rect x="30" y="230" width="100" height="90" rx="12" fill="#475569"/><text class="el" x="80" y="270" text-anchor="middle">EL2</text><text class="elsub" x="80" y="290" text-anchor="middle">hypervisor</text>
  <rect x="30" y="340" width="100" height="90" rx="12" fill="#334155"/><text class="el" x="80" y="380" text-anchor="middle">EL1</text><text class="elsub" x="80" y="400" text-anchor="middle">OS kernel</text>
  <rect x="30" y="450" width="100" height="90" rx="12" fill="#64748b"/><text class="el" x="80" y="490" text-anchor="middle">EL0</text><text class="elsub" x="80" y="510" text-anchor="middle">applications</text>

  <!-- EL3: spans both worlds -->
  <rect x="150" y="120" width="780" height="90" rx="12" fill="#be123c"/>
  <text class="nm" x="170" y="152" style="fill:#fff">TF-A · BL31 · secure monitor</text>
  <text class="sm" x="170" y="174" style="fill:#ffe4e6">The gate between the worlds. Handles every smc: PSCI (CPU on/off, suspend, reset) and i.MX SiP calls,</text>
  <text class="sm" x="170" y="192" style="fill:#ffe4e6">and forwards OP-TEE calls when a BL32 exists. Lives in OCRAM at 0x0097_0000 for as long as the board is on.</text>

  <!-- secure column -->
  <rect x="150" y="230" width="270" height="90" rx="12" fill="url(#hatch)" stroke="#26344f"/>
  <text class="nm" x="170" y="265" style="fill:#8a9bb3">S-EL2: not present</text>
  <text class="sm" x="170" y="286">Cortex-A53 is Armv8.0: no secure</text>
  <text class="sm" x="170" y="302">hypervisor level.</text>

  <rect x="150" y="340" width="270" height="90" rx="12" fill="#121c33" stroke="#f43f5e" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text class="nm" x="170" y="372" style="fill:#fda4af">OP-TEE OS · BL32</text>
  <text class="sm" x="170" y="393">trusted OS, its own memory locked</text>
  <text class="sm" x="170" y="410">by the TZASC · optional, not built</text>

  <rect x="150" y="450" width="270" height="90" rx="12" fill="#121c33" stroke="#f43f5e" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text class="nm" x="170" y="482" style="fill:#fda4af">Trusted Applications</text>
  <text class="sm" x="170" y="503">key handling, signing, secure</text>
  <text class="sm" x="170" y="520">storage · run inside OP-TEE</text>

  <!-- normal column -->
  <rect x="560" y="230" width="270" height="90" rx="12" fill="#123063" stroke="#3b82f6"/>
  <text class="nm" x="580" y="262" style="fill:#93c5fd">U-Boot proper · BL33</text>
  <text class="sm" x="580" y="283">during boot only, then:</text>
  <text class="sm" x="580" y="301">Linux hyp stub / KVM (nVHE)</text>

  <rect x="560" y="340" width="270" height="90" rx="12" fill="#0f766e"/>
  <text class="nm" x="580" y="372" style="fill:#fff">Linux kernel 6.18</text>
  <text class="sm" x="580" y="393" style="fill:#ccfbf1">drivers, scheduler, memory,</text>
  <text class="sm" x="580" y="410" style="fill:#ccfbf1">filesystems · enters at EL2, runs at EL1</text>

  <rect x="560" y="450" width="270" height="90" rx="12" fill="#0b3a36" stroke="#14b8a6"/>
  <text class="nm" x="580" y="482" style="fill:#5eead4">User space</text>
  <text class="sm" x="580" y="503">init, getty, sh, BusyBox,</text>
  <text class="sm" x="580" y="520">your application</text>

  <!-- normal corridor: smc up, eret down -->
  <line x1="862" y1="384" x2="862" y2="214" stroke="#fb7185" stroke-width="3.0" marker-end="url(#ar)"/>
  <rect x="842" y="262" width="40" height="20" rx="10" fill="#121c33" stroke="#9f1239"/><text class="ins mono" x="862" y="276" text-anchor="middle" style="fill:#fb7185">smc</text>
  <line x1="902" y1="212" x2="902" y2="382" stroke="#e5edf7" stroke-width="3.0" marker-end="url(#a)"/>
  <rect x="880" y="300" width="44" height="20" rx="10" fill="#121c33" stroke="#33415c"/><text class="ins mono" x="902" y="314" text-anchor="middle">eret</text>
  <line x1="842" y1="384" x2="832" y2="384" stroke="#fb7185" stroke-width="2.2"/>
  <line x1="832" y1="382" x2="860" y2="382" stroke="#fb7185" stroke-width="0.0"/>
  <line x1="902" y1="384" x2="834" y2="384" stroke="#e5edf7" stroke-width="0.0"/>

  <!-- secure corridor: eret down to S-EL1, smc back up -->
  <line x1="452" y1="212" x2="452" y2="382" stroke="#e5edf7" stroke-width="3.0" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="430" y="300" width="44" height="20" rx="10" fill="#121c33" stroke="#33415c"/><text class="ins mono" x="452" y="314" text-anchor="middle">eret</text>
  <line x1="492" y1="384" x2="492" y2="214" stroke="#fb7185" stroke-width="3.0" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="472" y="262" width="40" height="20" rx="10" fill="#121c33" stroke="#9f1239"/><text class="ins mono" x="492" y="276" text-anchor="middle" style="fill:#fb7185">smc</text>
  <line x1="422" y1="384" x2="492" y2="384" stroke="#fb7185" stroke-width="2.2" stroke-dasharray="5 4"/>
  <line x1="422" y1="384" x2="452" y2="384" stroke="#e5edf7" stroke-width="0.0"/>

  <!-- svc and hvc inside the normal column -->
  <line x1="660" y1="448" x2="660" y2="434" stroke="#e5edf7" stroke-width="3.0" marker-end="url(#a)"/>
  <text class="ins mono" x="670" y="446">svc</text><text class="sm" x="700" y="446">system call</text>
  <line x1="660" y1="338" x2="660" y2="324" stroke="#e5edf7" stroke-width="3.0" marker-end="url(#a)"/>
  <text class="ins mono" x="670" y="336">hvc</text><text class="sm" x="700" y="336">hypervisor call</text>

  <!-- instruction legend -->
  <rect x="30" y="566" width="900" height="124" rx="12" fill="#0f192d" stroke="#26344f"/>
  <text class="col" x="48" y="592" style="fill:#cbd5e1">THE ONLY WAYS TO CHANGE LEVEL</text>
  <text class="ins mono" x="48" y="620">svc</text><text class="exp" x="96" y="620">app → kernel (open, read, ioctl …). Linux handles it at EL1.</text>
  <text class="ins mono" x="48" y="644">hvc</text><text class="exp" x="96" y="644">kernel → EL2 (KVM). Not used by this image beyond the boot stub.</text>
  <text class="ins mono" x="48" y="668" style="fill:#fb7185">smc</text><text class="exp" x="96" y="668">kernel → EL3 (BL31): a deliberate, synchronous trap. Function ID in x0, arguments in x1–x7.</text>
  <text class="ins mono" x="520" y="620">eret</text><text class="exp" x="570" y="620">return to a lower level, in the world BL31</text>
  <text class="exp" x="570" y="636">chose: S-EL1 (OP-TEE) or EL1/EL2 (Linux).</text>
  <text class="exp" x="520" y="654">Apps (EL0) can never execute smc themselves.</text>

  <!-- evidence panel -->
  <rect x="960" y="120" width="410" height="570" rx="12" fill="#060b16"/>
  <text class="col" x="980" y="148" style="fill:#94a3b8">PROOF FROM THIS BOARD'S BOOT LOG</text>
  <text class="log mono" x="980" y="182" style="fill:#a7f3d0">psci: PSCIv1.1 detected in firmware.</text>
  <text class="exp" x="980" y="202" style="fill:#cbd5e1">Linux asked BL31 (by smc) which PSCI</text>
  <text class="exp" x="980" y="218" style="fill:#cbd5e1">version it implements → BL31 is there.</text>

  <text class="log mono" x="980" y="256" style="fill:#a7f3d0">smp: Brought up 1 node, 4 CPUs</text>
  <text class="exp" x="980" y="276" style="fill:#cbd5e1">CPUs 1–3 were started by smc PSCI</text>
  <text class="exp" x="980" y="292" style="fill:#cbd5e1">CPU_ON (x0 = 0xC400_0003) calls.</text>

  <text class="log mono" x="980" y="330" style="fill:#a7f3d0">CPU: All CPU(s) started at EL2</text>
  <text class="log mono" x="980" y="348" style="fill:#a7f3d0">kvm [1]: Hyp nVHE mode initialized</text>
  <text class="exp" x="980" y="368" style="fill:#cbd5e1">BL31 entered U-Boot at EL2, U-Boot kept</text>
  <text class="exp" x="980" y="384" style="fill:#cbd5e1">EL2 for Linux; the kernel parks a small</text>
  <text class="exp" x="980" y="400" style="fill:#cbd5e1">KVM stub there and runs at EL1.</text>

  <text class="log mono" x="980" y="438" style="fill:#fda4af">optee optee: OP-TEE api uid mismatch</text>
  <text class="exp" x="980" y="458" style="fill:#cbd5e1">U-Boot probed for OP-TEE with an smc;</text>
  <text class="exp" x="980" y="474" style="fill:#cbd5e1">BL31 has no BL32 to forward to, so the</text>
  <text class="exp" x="980" y="490" style="fill:#cbd5e1">secure world here is BL31 alone.</text>

  <line x1="980" y1="520" x2="1350" y2="520" stroke="#e5edf7"/>
  <text class="exp" x="980" y="548" style="fill:#e2e8f0">Read these yourself on the board:</text>
  <text class="log mono" x="980" y="574" style="fill:#93c5fd">dmesg | grep -iE "psci|EL2|kvm"</text>
  <text class="log mono" x="980" y="598" style="fill:#93c5fd">cat /sys/firmware/devicetree/base/\</text>
  <text class="log mono" x="980" y="616" style="fill:#93c5fd">    psci/compatible</text>
  <text class="exp" x="980" y="650" style="fill:#94a3b8">SMC function IDs follow Arm's SMCCC:</text>
  <text class="exp" x="980" y="668" style="fill:#94a3b8">0xC4… = PSCI (64-bit), 0xC2… = SiP (NXP).</text>
