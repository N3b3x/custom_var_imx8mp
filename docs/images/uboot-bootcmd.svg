<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-label="How U-Boot finds and starts Linux (bsp_bootcmd), with this board's real values: after a one-second autoboot delay it selects the boot MMC device, runs /boot/boot.scr if present, imports /boot/uEnv.txt if present, loads and unzips /boot/Image.gz (falling back to network boot), sizes the CMA pool from the RAM size, builds the kernel command line, derives the device-tree name from the module, its revision and the carrier, loads that device tree and calls booti.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif; fill: #e5edf7; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .t { font-size: 25px; font-weight: 700; }
    .st { font-size: 14px; }
    .col { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .nm { font-size: 13.5px; font-weight: 700; }
    .sm { font-size: 11.5px; white-space: pre; }
    .yn { font-size: 11px; font-weight: 700; }
    .log { font-size: 11.5px; }
  </style>
  <rect width="1400" height="920" rx="18" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="1399" height="919" rx="18" fill="none" stroke="#1e2a44"/>
  <text class="t" x="30" y="44">How U-Boot finds and starts Linux</text>
  <text class="st" x="30" y="68" style="fill:#9fb0c6">bootcmd = run bsp_bootcmd. Every step is an environment variable you can print, change, or override from /boot/uEnv.txt.</text>
  <text class="col" x="40" y="104" style="fill:#9fb0c6">THE FLOW · u-boot-initial-env</text>
  <text class="col" x="840" y="104" style="fill:#9fb0c6">ON YOUR VAR-SOM · from its boot log</text>

  <!-- spine -->
  <line x1="240" y1="166" x2="240" y2="858" stroke="#e5edf7" stroke-width="2.0"/>

  <!-- N0 -->
  <rect x="40" y="118" width="400" height="46" rx="10" fill="#060b16"/>
  <text class="nm" x="56" y="138" style="fill:#fff">Hit any key to stop autoboot: 1 s</text>
  <text class="sm mono" x="56" y="155" style="fill:#94a3b8">bootdelay=1 · then runs ${bootcmd}</text>
  <path d="M440,141 H520" stroke="#e5edf7" stroke-width="2.6" marker-end="url(#a)"/><text class="yn" x="448" y="135" style="fill:#9fb0c6">key</text>
  <rect x="524" y="126" width="236" height="30" rx="15" fill="#16223b" stroke="#33415c"/><text class="sm mono" x="642" y="145" text-anchor="middle">u-boot=&gt; prompt (printenv …)</text>

  <!-- N1 -->
  <rect x="40" y="186" width="400" height="46" rx="10" fill="#123063" stroke="#3b82f6"/>
  <text class="nm" x="56" y="206">mmc dev ${mmcdev}; mmc rescan</text>
  <text class="sm" x="56" y="223" style="fill:#9fb0c6">mmcdev = the device it booted from: 1 = SD, 2 = eMMC</text>

  <!-- N2 decision -->
  <rect x="40" y="254" width="400" height="46" rx="23" fill="#121c33" stroke="#334155" stroke-width="1.5"/>
  <text class="nm" x="240" y="282" text-anchor="middle">/boot/boot.scr exists?</text>
  <path d="M440,277 H520" stroke="#e5edf7" stroke-width="2.6" marker-end="url(#a)"/><text class="yn" x="452" y="271" style="fill:#6ee7b7">yes</text>
  <rect x="524" y="258" width="236" height="38" rx="10" fill="#2a1b05" stroke="#f59e0b"/><text class="sm" x="536" y="274">source it: the script decides</text><text class="sm" x="536" y="289">everything (rest is skipped)</text>
  <text class="yn" x="248" y="316" style="fill:#fb7185">no</text>

  <!-- N3 decision -->
  <rect x="40" y="322" width="400" height="46" rx="23" fill="#121c33" stroke="#334155" stroke-width="1.5"/>
  <text class="nm" x="240" y="350" text-anchor="middle">/boot/uEnv.txt exists?</text>
  <path d="M440,345 H520" stroke="#e5edf7" stroke-width="2.6" marker-end="url(#a)"/><text class="yn" x="452" y="339" style="fill:#6ee7b7">yes</text>
  <rect x="524" y="326" width="236" height="38" rx="10" fill="#2a1b05" stroke="#f59e0b"/><text class="sm mono" x="536" y="342">env import -t</text><text class="sm" x="536" y="357">override any variable, continue</text>

  <!-- N4 -->
  <rect x="40" y="390" width="400" height="58" rx="10" fill="#123063" stroke="#3b82f6"/>
  <text class="nm" x="56" y="410">loadimage</text>
  <text class="sm mono" x="56" y="427">load mmc 1:1 ${img_addr} /boot/Image.gz</text>
  <text class="sm mono" x="56" y="442">unzip ${img_addr} ${loadaddr}</text>
  <path d="M440,419 H520" stroke="#e5edf7" stroke-width="2.6" marker-end="url(#a)"/><text class="yn" x="448" y="413" style="fill:#fb7185">fails</text>
  <rect x="524" y="400" width="236" height="38" rx="10" fill="#16223b" stroke="#33415c"/><text class="sm" x="536" y="416">netboot: DHCP, then TFTP the</text><text class="sm" x="536" y="431">kernel + DTB from ${serverip}</text>

  <!-- N5 -->
  <rect x="40" y="470" width="400" height="46" rx="10" fill="#123063" stroke="#3b82f6"/>
  <text class="nm" x="56" y="490">ramsize_check → cma_size</text>
  <text class="sm" x="56" y="507" style="fill:#9fb0c6">≤512 MiB: 64M · ≤1 GiB: 320M · ≤2 GiB: 384M · else 704M</text>

  <!-- N6 -->
  <rect x="40" y="538" width="400" height="58" rx="10" fill="#123063" stroke="#3b82f6"/>
  <text class="nm" x="56" y="558">mmcargs + optargs → bootargs</text>
  <text class="sm mono" x="56" y="575">console=${console} root=/dev/mmcblk${mmcblk}p1</text>
  <text class="sm mono" x="56" y="590">rootwait rw ${cma_size} … ${kernelargs}</text>

  <!-- N7 -->
  <rect x="40" y="618" width="400" height="88" rx="10" fill="#1d1640" stroke="#8b5cf6"/>
  <text class="nm" x="56" y="638">findfdt → ${fdt_file}</text>
  <text class="sm" x="56" y="656">module   ← board_name (EEPROM): dart / som / smarc</text>
  <text class="sm" x="56" y="672">suffix   ← som_rev &lt; 2: "-1.x" · WBE module: "-wbe"</text>
  <text class="sm" x="56" y="688">carrier  ← ${carrier_name}, default sonata / symphony / echo</text>
  <text class="sm mono" x="56" y="702" style="fill:#c4b5fd">imx8mp-var-&lt;module&gt;&lt;suffix&gt;-&lt;carrier&gt;.dtb</text>

  <!-- N8 -->
  <rect x="40" y="728" width="400" height="46" rx="10" fill="#123063" stroke="#3b82f6"/>
  <text class="nm" x="56" y="748">loadfdt</text>
  <text class="sm mono" x="56" y="765">load mmc 1:1 ${fdt_addr} /boot/${fdt_file}</text>

  <!-- N9 -->
  <rect x="40" y="796" width="400" height="62" rx="10" fill="#0f766e"/>
  <text class="nm mono" x="56" y="820" style="fill:#fff">booti ${loadaddr} - ${fdt_addr}</text>
  <text class="sm" x="56" y="840" style="fill:#ccfbf1">jump into the kernel with the DTB; U-Boot is gone</text>

  <!-- ====== right: real values ====== -->
  <g>
    <rect x="800" y="118" width="570" height="740" rx="12" fill="#060b16"/>
    <line x1="780" y1="209" x2="800" y2="209" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="206" style="fill:#a7f3d0">mmc1 is current device</text>
    <text class="sm" x="820" y="223" style="fill:#94a3b8">booted from the SD card → mmcdev=1, mmcblk=1</text>

    <line x1="780" y1="277" x2="800" y2="277" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="282" style="fill:#fde68a">Failed to load '/boot/boot.scr'</text>
    <line x1="780" y1="345" x2="800" y2="345" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="350" style="fill:#fde68a">Failed to load '/boot/uEnv.txt'</text>
    <text class="sm" x="820" y="367" style="fill:#94a3b8">both optional: normal, not errors</text>

    <line x1="780" y1="419" x2="800" y2="419" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="416" style="fill:#a7f3d0">15647614 bytes read in 648 ms (23 MiB/s)</text>
    <text class="log mono" x="820" y="434" style="fill:#a7f3d0">Uncompressed size: 35887616 = 0x2239A00</text>

    <line x1="780" y1="493" x2="800" y2="493" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="498" style="fill:#e2e8f0">DRAM: 4 GiB  →  cma=704M</text>

    <line x1="780" y1="567" x2="800" y2="567" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="564" style="fill:#a7f3d0">console=ttymxc1,115200 root=/dev/mmcblk1p1</text>
    <text class="log mono" x="820" y="582" style="fill:#a7f3d0">rootwait rw cma=704M cma_name=linux,cma</text>

    <line x1="780" y1="662" x2="800" y2="662" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="sm" x="820" y="640" style="fill:#e2e8f0">board_name = VAR-SOM-MX8M-PLUS  → imx8mp-var-som</text>
    <text class="sm" x="820" y="657" style="fill:#e2e8f0">SOM revision: 1.2 (&lt; 2)            → -1.x</text>
    <text class="sm" x="820" y="674" style="fill:#e2e8f0">carrier (default for SOM)          → symphony</text>
    <text class="log mono" x="820" y="696" style="fill:#c4b5fd">fdt_file=imx8mp-var-som-1.x-symphony.dtb</text>

    <line x1="780" y1="751" x2="800" y2="751" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="756" style="fill:#a7f3d0">80018 bytes read in 5 ms (15.3 MiB/s)</text>

    <line x1="780" y1="827" x2="800" y2="827" stroke="#64748b" stroke-dasharray="3 3"/>
    <text class="log mono" x="820" y="820" style="fill:#a7f3d0">Moving Image from 0x40480000 to 0x40600000</text>
    <text class="log mono" x="820" y="838" style="fill:#a7f3d0">Starting kernel ...</text>
  </g>

  <text class="sm" x="40" y="890" style="fill:#9fb0c6">Try it: stop autoboot, then  printenv bsp_bootcmd  ·  run findfdt; printenv fdt_file  ·  setenv kernelargs loglevel=8; boot  ·  env default -a; saveenv  (factory reset)</text>
<g id="icons"><g transform="translate(406,128) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="M12 6v6l4 2" /></g><g transform="translate(406,197) scale(0.916667)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01" /> <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /> <path d="M21.946 12.013H2.054" /> <path d="M6 16h.01" /></g><g transform="translate(406,266) scale(0.916667)" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h-5" /> <path d="M15 8h-5" /> <path d="M19 17V5a2 2 0 0 0-2-2H4" /> <path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3" /></g><g transform="translate(406,334) scale(0.916667)" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8a1 1 0 0 1-1-1V2a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8z" /> <path d="M20 8v12a2 2 0 0 1-2 2h-4.182" /> <path d="m3.305 19.53.923-.382" /> <path d="M4 10.592V4a2 2 0 0 1 2-2h8" /> <path d="m4.228 16.852-.924-.383" /> <path d="m5.852 15.228-.383-.923" /> <path d="m5.852 20.772-.383.924" /> <path d="m8.148 15.228.383-.923" /> <path d="m8.53 21.696-.382-.924" /> <path d="m9.773 16.852.922-.383" /> <path d="m9.773 19.148.922.383" /> <circle cx="7" cy="18" r="3" /></g><g transform="translate(406,400) scale(0.916667)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></g><g transform="translate(406,481) scale(0.916667)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v-2" /> <path d="M12 18v-2" /> <path d="M16 12v-2" /> <path d="M16 18v-2" /> <path d="M2 11h1.5" /> <path d="M20 18v-2" /> <path d="M20.5 11H22" /> <path d="M4 18v-2" /> <path d="M8 12v-2" /> <path d="M8 18v-2" /> <rect x="2" y="6" width="20" height="10" rx="2" /></g><g transform="translate(406,548) scale(0.916667)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5" /> <path d="M19 7h-9" /> <circle cx="17" cy="17" r="3" /> <circle cx="7" cy="7" r="3" /></g><g transform="translate(406,628) scale(0.916667)" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2" /> <path d="M17 3h2a2 2 0 0 1 2 2v2" /> <path d="M21 17v2a2 2 0 0 1-2 2h-2" /> <path d="M7 21H5a2 2 0 0 1-2-2v-2" /> <circle cx="12" cy="12" r="3" /> <path d="m16 16-1.9-1.9" /></g><g transform="translate(406,739) scale(0.916667)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /> <path d="M14 2v5a1 1 0 0 0 1 1h5" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /></g><g transform="translate(406,808) scale(0.916667)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" /> <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09" /> <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" /> <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" /></g><g transform="translate(1336,130) scale(0.916667)" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 2-2-2-2" /> <path d="M11 13h4" /> <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /></g></g><!--/icons--></svg>
