<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-label="Step chart of the boot CPU's exception level over time: Boot ROM, SPL and BL31 at EL3; U-Boot and the start of Linux at EL2; the Linux kernel at EL1; init and applications at EL0. At runtime the CPU briefly rises for PSCI smc calls to EL3, for system calls and interrupts to EL1, and a reboot goes from EL0 by svc to EL1 and by smc SYSTEM_RESET to EL3, which resets the chip."><rect x="0" y="0" width="1400" height="660" rx="18" fill="#0b1220" stroke="#1e2a44" stroke-width="1.2"/><defs><marker id="m-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><marker id="m-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5edf7"/></marker></defs><text x="32" y="46" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="26" font-weight="700" text-anchor="start" style="fill:#e5edf7;white-space:pre">The boot CPU's elevator log: which level it's on, over time</text><text x="32" y="72" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="14" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Boot only ever goes down. At runtime the CPU pops up for a moment (syscall, smc, interrupt) and eret brings it back.</text><text x="40" y="156" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="20" font-weight="800" text-anchor="start" style="fill:#fda4af;white-space:pre">EL3</text><line x1="96" y1="150" x2="1370" y2="150" stroke="#1e2a44" stroke-dasharray="3 6"/><text x="40" y="256" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="20" font-weight="800" text-anchor="start" style="fill:#93c5fd;white-space:pre">EL2</text><line x1="96" y1="250" x2="1370" y2="250" stroke="#1e2a44" stroke-dasharray="3 6"/><text x="40" y="356" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="20" font-weight="800" text-anchor="start" style="fill:#5eead4;white-space:pre">EL1</text><line x1="96" y1="350" x2="1370" y2="350" stroke="#1e2a44" stroke-dasharray="3 6"/><text x="40" y="456" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="20" font-weight="800" text-anchor="start" style="fill:#5eead4;white-space:pre">EL0</text><line x1="96" y1="450" x2="1370" y2="450" stroke="#1e2a44" stroke-dasharray="3 6"/><text x="40" y="516" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">time →</text><rect x="102" y="135" width="126" height="30" rx="8" fill="#e11d48"/><text x="165" y="155" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Boot ROM</text><text x="165" y="184" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#9fb0c6;white-space:pre">silicon</text><rect x="232" y="135" width="136" height="30" rx="8" fill="#e11d48"/><text x="300" y="155" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">SPL</text><text x="300" y="184" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#9fb0c6;white-space:pre">DDR training</text><rect x="372" y="135" width="96" height="30" rx="8" fill="#e11d48"/><text x="420" y="155" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">BL31</text><text x="420" y="184" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#9fb0c6;white-space:pre">set up EL3</text><line x1="470" y1="150" x2="470" y2="244" stroke="#e5edf7" stroke-width="3" marker-end="url(#m-d)"/><rect x="472" y="235" width="136" height="30" rx="8" fill="#2563eb"/><text x="540" y="255" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">U-Boot</text><text x="540" y="284" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#9fb0c6;white-space:pre">load kernel</text><rect x="612" y="235" width="66" height="30" rx="8" fill="#2563eb"/><text x="645" y="255" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Linux</text><text x="645" y="284" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#9fb0c6;white-space:pre">head.S</text><line x1="680" y1="250" x2="680" y2="344" stroke="#e5edf7" stroke-width="3" marker-end="url(#m-d)"/><rect x="682" y="335" width="296" height="30" rx="8" fill="#0d9488"/><text x="830" y="355" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">Linux kernel</text><text x="830" y="384" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="11.5" font-weight="400" text-anchor="middle" style="fill:#9fb0c6;white-space:pre">drivers probe</text><line x1="980" y1="350" x2="980" y2="444" stroke="#e5edf7" stroke-width="3" marker-end="url(#m-d)"/><rect x="982" y="435" width="386" height="30" rx="8" fill="#14b8a6"/><text x="1175" y="455" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="800" text-anchor="middle" style="fill:#fff;white-space:pre">/sbin/init → login → your app</text><line x1="800" y1="334" x2="800" y2="168" stroke="#fb7185" stroke-width="3" marker-end="url(#m-u)"/><rect x="800" y="137" width="26" height="26" rx="6" fill="#e11d48"/><line x1="826" y1="168" x2="826" y2="334" stroke="#e5edf7" stroke-width="3" marker-end="url(#m-d)"/><rect x="741.62" y="110" width="142.76" height="21" rx="10.5" fill="#0b1220" stroke="#fb7185" stroke-width="1.5"/><text x="813" y="124" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="middle" style="fill:#fb7185;white-space:pre">smc PSCI CPU_ON ×3</text><line x1="1060" y1="434" x2="1060" y2="368" stroke="#2dd4bf" stroke-width="3" marker-end="url(#m-u)"/><rect x="1060" y="337" width="26" height="26" rx="6" fill="#0d9488"/><line x1="1086" y1="368" x2="1086" y2="434" stroke="#e5edf7" stroke-width="3" marker-end="url(#m-d)"/><rect x="1025.49" y="310" width="95.02" height="21" rx="10.5" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="1073" y="324" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="middle" style="fill:#2dd4bf;white-space:pre">svc: read()</text><line x1="1160" y1="434" x2="1160" y2="368" stroke="#fbbf24" stroke-width="3" marker-end="url(#m-u)"/><rect x="1160" y="337" width="26" height="26" rx="6" fill="#0d9488"/><line x1="1186" y1="368" x2="1186" y2="434" stroke="#e5edf7" stroke-width="3" marker-end="url(#m-d)"/><rect x="1128.9" y="310" width="88.2" height="21" rx="10.5" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/><text x="1173" y="324" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="middle" style="fill:#fbbf24;white-space:pre">IRQ: timer</text><line x1="1270" y1="434" x2="1270" y2="368" stroke="#2dd4bf" stroke-width="3" marker-end="url(#m-u)"/><rect x="1257" y="337" width="26" height="26" rx="6" fill="#0d9488"/><rect x="1222.49" y="310" width="95.02" height="21" rx="10.5" fill="#0b1220" stroke="#2dd4bf" stroke-width="1.5"/><text x="1270" y="324" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="middle" style="fill:#2dd4bf;white-space:pre">svc: reboot</text><line x1="1270" y1="334" x2="1270" y2="168" stroke="#fb7185" stroke-width="3" marker-end="url(#m-u)"/><rect x="1257" y="137" width="26" height="26" rx="6" fill="#e11d48"/><rect x="1000.19" y="110" width="299.62" height="21" rx="10.5" fill="#0b1220" stroke="#fb7185" stroke-width="1.5"/><text x="1150" y="124" font-family='"SFMono-Regular", Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace' font-size="11" font-weight="700" text-anchor="middle" style="fill:#fb7185;white-space:pre">smc SYSTEM_RESET → chip resets → Boot ROM</text><rect x="32" y="548" width="1336" height="92" rx="14" fill="#121c33" stroke="#26344f" stroke-width="1.2"/><line x1="52" y1="580" x2="86" y2="580" stroke="#e5edf7" stroke-width="3.4"/><text x="96" y="585" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">eret / boot hand-off: down a level</text><line x1="420" y1="580" x2="454" y2="580" stroke="#fb7185" stroke-width="3.4"/><text x="464" y="585" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">smc: into EL3 (BL31)</text><line x1="690" y1="580" x2="724" y2="580" stroke="#2dd4bf" stroke-width="3.4"/><text x="734" y="585" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">svc: app → kernel</text><line x1="930" y1="580" x2="964" y2="580" stroke="#fbbf24" stroke-width="3.4"/><text x="974" y="585" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12.5" font-weight="400" text-anchor="start" style="fill:#e5edf7;white-space:pre">interrupt: hardware → kernel</text><text x="52" y="620" font-family='"Segoe UI", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif' font-size="12" font-weight="400" text-anchor="start" style="fill:#9fb0c6;white-space:pre">Real numbers from this board: CPUs 1-3 started by smc PSCI CPU_ON at 0.005 s; /sbin/init at 3.44 s. After boot BL31 is only ever entered through smc (or a secure interrupt). Every app instruction runs at EL0.</text></svg>
