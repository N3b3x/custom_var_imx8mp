# shellcheck shell=bash
# =============================================================================
#  Board / BSP configuration for the Variscite DART-MX8M-PLUS & VAR-SOM-MX8M-PLUS
# =============================================================================
#
#  This file is *sourced* by every script in scripts/. It only sets variables.
#
#  Every value uses the form  : "${VAR:=default}"  which means:
#     "if VAR is already set in the environment, keep it, otherwise use default"
#  So you can override anything for a single run without editing this file:
#
#     KERNEL_BRANCH=lf-6.12.y_6.12.49-2.2.0_var01 KERNEL_REV= ./build.sh kernel
#
#  Or keep your overrides in config/local.conf (git-ignored), which build.sh
#  sources *before* this file.
#
#  The versions below are the exact ones Variscite pins in its Yocto BSP layer
#  meta-variscite-bsp-imx, branch "wrynose_6.18.20_2.0.0_var01" (NXP release
#  LF6.18.20-2.0.0, Yocto 6.0 "Wrynose"). See docs/10-versions.md for how they
#  were found and how to move to a newer release.
#
#  *_REV variables pin a git commit for reproducible builds. Set one to an empty
#  string (e.g. UBOOT_REV=) to follow the tip of the branch instead.
# =============================================================================

# -----------------------------------------------------------------------------
# Release name, used only in banners/log messages and the image file name
# -----------------------------------------------------------------------------
: "${BSP_RELEASE:=wrynose-6.18.20-2.0.0}"

# -----------------------------------------------------------------------------
# U-Boot (Variscite fork of NXP's uboot-imx)
# -----------------------------------------------------------------------------
: "${UBOOT_REPO:=https://github.com/varigit/uboot-imx.git}"
: "${UBOOT_BRANCH:=lf_v2026.04_6.18.20-2.0.0_var01}"
: "${UBOOT_REV:=9ee215f6a5786712477879125679721ee8bee895}"
# One defconfig serves DART-MX8M-PLUS, VAR-SOM-MX8M-PLUS and VAR-SMARC-MX8M-PLUS.
# The SPL detects which module it runs on at boot time.
: "${UBOOT_DEFCONFIG:=imx8mp_var_dart_defconfig}"
# Device trees U-Boot itself uses (NOT the Linux ones). The first one is the
# default; the others are packed into the same FIT image and selected at
# runtime by the SPL according to the detected module.
: "${UBOOT_DTBS:=imx8mp-var-dart-sonataboard.dtb imx8mp-var-som-symphony.dtb imx8mp-var-smarc-echo.dtb}"

# -----------------------------------------------------------------------------
# Arm Trusted Firmware (TF-A, BL31) - runs in EL3, provides PSCI (CPU on/off,
# suspend) and the secure monitor
# -----------------------------------------------------------------------------
: "${ATF_REPO:=https://github.com/varigit/imx-atf.git}"
: "${ATF_BRANCH:=lf_v2.12_6.18.2-1.0.0_var01}"
: "${ATF_REV:=bf53e42ff8fea3a1477df93ff264bcbee613f7aa}"
: "${ATF_PLATFORM:=imx8mp}"

# -----------------------------------------------------------------------------
# imx-mkimage - NXP tool that glues SPL + DDR firmware + ATF + U-Boot into the
# single "flash.bin" (a.k.a. imx-boot) the i.MX8MP Boot ROM can load
# -----------------------------------------------------------------------------
: "${MKIMAGE_REPO:=https://github.com/varigit/imx-mkimage.git}"
: "${MKIMAGE_BRANCH:=lf-6.18.20_2.0.0_var01}"
: "${MKIMAGE_REV:=e877d8119d4599fb068f4599e6f22e2f4fcb593b}"
: "${MKIMAGE_SOC:=iMX8MP}"
: "${MKIMAGE_TARGET:=flash_evk}"

# -----------------------------------------------------------------------------
# NXP firmware-imx - we need the LPDDR4 PHY training firmware from it.
# It is a self-extracting archive behind NXP's EULA (see docs/03-uboot.md).
# -----------------------------------------------------------------------------
: "${FIRMWARE_IMX_VERSION:=8.32}"
: "${FIRMWARE_IMX_HASH:=1991416}"
: "${FIRMWARE_IMX_SHA256:=11396e5798b62cd61963db806c0c05500887bc62a98e1d16dbc3014aa0c21a2a}"
: "${FIRMWARE_IMX_URL:=https://www.nxp.com/lgfiles/NMG/MAD/YOCTO/firmware-imx-${FIRMWARE_IMX_VERSION}-${FIRMWARE_IMX_HASH}.bin}"
: "${DDR_FIRMWARE_FILES:=lpddr4_pmu_train_1d_dmem_202006.bin lpddr4_pmu_train_1d_imem_202006.bin lpddr4_pmu_train_2d_dmem_202006.bin lpddr4_pmu_train_2d_imem_202006.bin}"

# -----------------------------------------------------------------------------
# Linux kernel (Variscite fork of NXP's linux-imx)
# -----------------------------------------------------------------------------
: "${KERNEL_REPO:=https://github.com/varigit/linux-imx.git}"
: "${KERNEL_BRANCH:=lf-6.18.y_6.18.20-2.0.0_var01}"
: "${KERNEL_REV:=d7eb295c33ab6bc199e6e1ea088aa21aeb70b3c8}"
: "${KERNEL_DEFCONFIG:=imx8_var_defconfig}"
# The U-Boot environment expects a gzip-compressed kernel at /boot/Image.gz
: "${KERNEL_IMAGE:=Image.gz}"
# Appended to `uname -r`, e.g. 6.18.20-custom
: "${KERNEL_LOCALVERSION:=-custom}"
# Which device trees to build and install into /boot.
#   all          -> every freescale/imx8mp-var-*.dts in the tree (recommended,
#                   U-Boot picks the right one automatically at boot)
#   a list       -> e.g. "imx8mp-var-dart-sonata.dtb imx8mp-var-som-symphony.dtb"
: "${KERNEL_DTBS:=all}"

# -----------------------------------------------------------------------------
# Cross toolchain
#   arm    -> download the pinned Arm GNU Toolchain below into build/toolchain
#             (default: reproducible, same compiler on every machine)
#   system -> use whatever aarch64-linux-gnu-gcc is on $PATH
#             (sudo apt install gcc-aarch64-linux-gnu)
# -----------------------------------------------------------------------------
: "${TOOLCHAIN:=arm}"
: "${ARM_TOOLCHAIN_VERSION:=14.3.rel1}"
: "${ARM_TOOLCHAIN_SHA256:=ddeaff1ea60d4135acba271b0143d9f5add02b68ab9e9be39672d1965c12e82f}"
: "${ARM_TOOLCHAIN_URL:=https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-aarch64-none-linux-gnu.tar.xz}"
# Use ccache automatically when it is installed (makes rebuilds much faster)
: "${USE_CCACHE:=auto}"

# -----------------------------------------------------------------------------
# Root filesystem (see docs/05-rootfs.md)
#   debian           -> build a Debian arm64 rootfs with mmdebstrap (needs sudo
#                       or uidmap for rootless mode)
#   alpine           -> download the tiny Alpine minirootfs (no root needed,
#                       handy for a quick bring-up / smoke test)
#   /path/to/rootfs.tar[.gz|.xz|.zst|.bz2]
#                    -> use your own tarball (e.g. a Variscite Yocto/Debian
#                       rootfs or one you built elsewhere)
# -----------------------------------------------------------------------------
: "${ROOTFS:=debian}"
: "${DEBIAN_SUITE:=trixie}"
: "${DEBIAN_MIRROR:=http://deb.debian.org/debian}"
# Debian's archive signing keys. Ubuntu (and older Debian) hosts do not have
# the trixie keys, so the official keyring package is downloaded (checksum
# pinned) and handed to mmdebstrap with --keyring.
: "${DEBIAN_KEYRING_URL:=https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb}"
: "${DEBIAN_KEYRING_SHA256:=9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac}"
: "${DEBIAN_PACKAGES:=systemd-sysv udev dbus kmod iproute2 iputils-ping netbase openssh-server sudo less nano vim-tiny ca-certificates tzdata systemd-timesyncd util-linux-extra e2fsprogs parted fdisk usbutils pciutils i2c-tools can-utils ethtool wget curl htop}"
: "${ALPINE_VERSION:=3.24.2}"
: "${TARGET_HOSTNAME:=imx8mp-var-dart}"
: "${TARGET_USER:=var}"
# Default password for root and $TARGET_USER. CHANGE IT on anything that is not
# a bench prototype.
: "${TARGET_PASSWORD:=variscite}"
# Fallback serial console for the Alpine login prompt. Normally unused: the
# login follows the console= U-Boot passes (ttymxc0 on DART, ttymxc1 on
# VAR-SOM / SMARC).
: "${TARGET_CONSOLE:=ttymxc0}"

# -----------------------------------------------------------------------------
# SD card image layout (matches Variscite's imx-imx-boot-singlepart.wks)
#
#   0      32KiB                8MiB                                  end
#   |  MBR  | imx-boot (flash.bin)  | p1: ext4 rootfs (label "root")   |
#                 ^ i.MX8MP Boot ROM reads it from 32 KiB on SD/eMMC
#                         U-Boot env lives at 7 MiB (CONFIG_ENV_OFFSET)
# -----------------------------------------------------------------------------
: "${IMX_BOOT_SEEK_KB:=32}"
: "${ROOTFS_PART_START_MB:=8}"
: "${ROOTFS_LABEL:=root}"
# Free space (MiB) added on top of the rootfs content. The partition can also
# be grown to the full card when flashing (./build.sh flash --expand).
: "${IMAGE_EXTRA_MB:=512}"
